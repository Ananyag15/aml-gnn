[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "amlgnn"
version = "0.1.0"
description = "Graph Neural Networks for detecting money-laundering patterns in Bitcoin transaction networks"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
